[camera]
index = 6
width = 640
height = 480
fps = 30
flip_vertical = false

[detection]
roi_top_ratio = 0.00
roi_bottom_ratio = 1.00
roi_left_ratio = 0.00
roi_right_ratio = 1.00
n_bands = 3

[curve]
min_points_for_poly = 3

[yolo]
model = /home/rnd/line_ball_hurdle_grasp_extra-2/weights/best.engine
conf = 0.2
line_conf = 0.45
# 라인 판단과 별개로 화면에는 이 값보다 큰 라인만 표시한다.
line_display_conf = 0.40
ball_conf = 0.35
hurdle_conf = 0.2
imgsz = 640
device = 0
line_class = line
ball_class = ball
hurdle_class = hurdle

[raw_ball_in_hand]
# 화면 BALL 패널의 실제 계산값(표시 반올림 전)을 모두 만족하면 true이다.
# 모든 범위가 이 시간 동안 끊김 없이 유지되어야 true가 된다.
hold_seconds = 0.15
angle_min_deg = -65.0
angle_max_deg = -50.0
x_min_px = -310.0
x_max_px = -250.0
y_min_px = 130.0
y_max_px = 210.0

[visibility]
# If 30% or more of the object is cut/hidden, require at least 70% visible.
min_visible_ratio = 0.70
# YOLO boxes are usually clipped to the frame, so this rejects selected objects touching image borders.
reject_edge_cut_objects = false
edge_margin = 3
# 공과 허들 모두 화면 경계에 닿아도 검출 결과를 유지한다.
partial_filter_classes =

[output]
# rqt_image_view 토픽을 사용한다. imshow 창은 GUI 대기와 프레임 복사를
# 추가하므로 통합/단독 launch에서 모두 기본적으로 끈다.
show_window = false
save_video =
print_every_n_frames = 5
publish_hurdle_result = false

[realsense_yolo]
model = /home/rnd/realsense_goal_backboard_ball_best.engine
conf = 0.20
goal_conf = 0.30
backboard_conf = 0.30
ball_conf = 0.25
imgsz = 640
device = 0
max_fps = 30

goal_class = goal
backboard_class = backboard
ball_class = ball

depth_scale = 0.001
depth_min_m = 0.08
depth_max_m = 3.0
depth_inner_ratio_ball = 0.45
depth_inner_ratio_hoop = 0.30
min_valid_depth_pixels = 5

publish_debug_image = true
print_every_n_frames = 10
